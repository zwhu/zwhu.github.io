<h1>同一个南京主角，两份程序绘制样品</h1>
<p>两版均为每帧48×64、下／上／左／右四向站姿、透明PNG，脚底对齐。Codex版自行编写轮廓与色块，没有复制或修改TraeX的绘图几何，也未抽取原图像素。棋盘格仅用于显示透明区域。</p>
<section><h2>Codex 绘制</h2><figure><img class="sheet" src="preview.png" alt="Codex绘制的南京主角四向站姿：黑发、浅领红上衣、深裤与靴"><div class="labels"><span>向下</span><span>向上</span><span>向左</span><span>向右</span></div><figcaption>图集1,298 B，18种RGBA值（含透明）。头部收窄、躯干更修长，使用不规则发束与分块衣褶；侧向几何主要镜像。</figcaption></figure></section>
<section><h2>TraeX 绘制</h2><figure><img class="sheet" src="../traex-program-character-v1/preview.png" alt="TraeX绘制的同一主角四向站姿"><div class="labels"><span>向下</span><span>向上</span><span>向左</span><span>向右</span></div><figcaption>图集1,460 B，20种RGBA值（含透明）。保持相同画布与展示宽度，不按文件大小评价美术质量。</figcaption></figure></section>
<section><h2>南京原有造型参考</h2><figure class="reference"><img src="../character-four-directions-v1.png" alt="南京已有人物四向设定参考"><figcaption>原作造型参考；分辨率和绘制方式不同，不能拿整幅参考文件与小图集计算压缩率。</figcaption></figure></section>
<p>我对自己的判断：基本服装与四向辨识度已保留，但侧脸、鞋型与发束仍有差别，尚未达到南京成品的一致性要求。两版都只有站姿，不代表行走、情绪或坐姿已经完成。</p>
