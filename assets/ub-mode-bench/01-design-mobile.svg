<svg xmlns="http://www.w3.org/2000/svg" width="330" height="554" viewBox="0 0 330 554" role="img" aria-labelledby="title" data-graph-type="flowchart">
<title id="title">同一个任务，加不加 ub-mode</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#77746e"/></marker></defs>
<rect width="330" height="554" fill="#faf8f3" data-graph-role="background"/>
<text x="24" y="32" font-size="15" font-weight="500" text-anchor="start" fill="#292825">同一个任务，加不加 ub-mode</text>
<text x="24" y="57" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">同模型比较 · 独立运行 · 共同验收</text>
<rect id="start" data-node-id="start" data-graph-role="node" data-graph-bounds="24,86,306,156" x="24" y="86" width="282" height="70" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="165.0" y="118.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">同一份修复起点</text>
<text x="165.0" y="137.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">源码＋问题描述＋测试命令</text>
<rect id="a" data-node-id="a" data-graph-role="node" data-graph-bounds="24,218,148,314" x="24" y="218" width="124" height="96" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="86.0" y="263.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">普通组 A</text>
<text x="86.0" y="282.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">无额外 Skill</text>
<rect id="c" data-node-id="c" data-graph-role="node" data-graph-bounds="182,218,306,314" x="182" y="218" width="124" height="96" rx="4" fill="#faf8f3" stroke="#a64335"/>
<text x="244.0" y="263.0" font-size="14" font-weight="500" text-anchor="middle" fill="#a64335">ub-mode C</text>
<text x="244.0" y="282.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">规范＋质量工具</text>
<rect id="eval" data-node-id="eval" data-graph-role="node" data-graph-bounds="24,386,306,456" x="24" y="386" width="282" height="70" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="165.0" y="418.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">共同的外部验收</text>
<text x="165.0" y="437.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">行为测试＋质量指标</text>
<path id="sa" data-edge-id="sa" data-source="start" data-target="a" data-graph-role="edge" d="M86 156 L86 218" fill="none" stroke="#77746e" stroke-width="1.25" marker-end="url(#arrow)"/>
<path id="sc" data-edge-id="sc" data-source="start" data-target="c" data-graph-role="edge" d="M244 156 L244 218" fill="none" stroke="#77746e" stroke-width="1.25" marker-end="url(#arrow)"/>
<path id="ae" data-edge-id="ae" data-source="a" data-target="eval" data-graph-role="edge" d="M86 314 L86 386" fill="none" stroke="#77746e" stroke-width="1.25" marker-end="url(#arrow)"/>
<path id="ce" data-edge-id="ce" data-source="c" data-target="eval" data-graph-role="edge" d="M244 314 L244 386" fill="none" stroke="#77746e" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="24" y="500" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">第一轮：3 任务 × 3 模型 × 2 组 × 3 次 = 54</text>
<text x="24" y="526" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">第二轮：1 任务 × 3 模型 × 2 组 × 3 次 = 18</text>
</svg>
