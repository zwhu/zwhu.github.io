<svg xmlns="http://www.w3.org/2000/svg" width="330" height="820" viewBox="0 0 330 820" role="img" aria-labelledby="title" data-graph-type="flowchart">
<title id="title">评测本身，也需要被检验</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#77746e"/></marker></defs>
<rect width="330" height="820" fill="#faf8f3" data-graph-role="background"/>
<text x="24" y="32" font-size="15" font-weight="500" text-anchor="start" fill="#292825">评测本身，也需要被检验</text>
<rect id="f0n0" data-node-id="f0n0" data-graph-role="node" data-graph-bounds="24,90,306,170" x="24" y="90" width="282" height="80" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="165.0" y="127.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">依赖包带着现成修复</text>
<text x="165.0" y="146.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">断网环境仍存在参考实现</text>
<rect id="f0n1" data-node-id="f0n1" data-graph-role="node" data-graph-bounds="24,200,306,280" x="24" y="200" width="282" height="80" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="165.0" y="237.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">排除受影响结果</text>
<text x="165.0" y="256.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">36 次正式结果＋6 次试跑作废</text>
<path id="f0e1" data-edge-id="f0e1" data-source="f0n0" data-target="f0n1" data-graph-role="edge" d="M165.0 170 L165.0 200" fill="none" stroke="#77746e" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect id="f0n2" data-node-id="f0n2" data-graph-role="node" data-graph-bounds="24,310,306,390" x="24" y="310" width="282" height="80" rx="4" fill="#faf8f3" stroke="#a64335"/>
<text x="165.0" y="347.0" font-size="14" font-weight="500" text-anchor="middle" fill="#a64335">锁定修复前依赖，重跑</text>
<text x="165.0" y="366.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">最终只统计干净的正式结果</text>
<path id="f0e2" data-edge-id="f0e2" data-source="f0n1" data-target="f0n2" data-graph-role="edge" d="M165.0 280 L165.0 310" fill="none" stroke="#77746e" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M24 438 H306" stroke="#e6e2da" data-graph-role="decoration"/>
<rect id="f1n0" data-node-id="f1n0" data-graph-role="node" data-graph-bounds="24,490,306,570" x="24" y="490" width="282" height="80" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="165.0" y="527.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">隐藏断言限定内部实现</text>
<text x="165.0" y="546.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">复制 AST 的合法修复被判失败</text>
<rect id="f1n1" data-node-id="f1n1" data-graph-role="node" data-graph-bounds="24,600,306,680" x="24" y="600" width="282" height="80" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="165.0" y="637.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">保留原始记录，统一复核</text>
<text x="165.0" y="656.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">对全部 18 份修复重新检查行为</text>
<path id="f1e1" data-edge-id="f1e1" data-source="f1n0" data-target="f1n1" data-graph-role="edge" d="M165.0 570 L165.0 600" fill="none" stroke="#77746e" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect id="f1n2" data-node-id="f1n2" data-graph-role="node" data-graph-bounds="24,710,306,790" x="24" y="710" width="282" height="80" rx="4" fill="#faf8f3" stroke="#a64335"/>
<text x="165.0" y="747.0" font-size="14" font-weight="500" text-anchor="middle" fill="#a64335">只导入生产源码核验</text>
<text x="165.0" y="766.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">恢复原版测试，并加入新输入</text>
<path id="f1e2" data-edge-id="f1e2" data-source="f1n1" data-target="f1n2" data-graph-role="edge" d="M165.0 680 L165.0 710" fill="none" stroke="#77746e" stroke-width="1.25" marker-end="url(#arrow)"/>
</svg>
