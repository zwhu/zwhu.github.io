<svg xmlns="http://www.w3.org/2000/svg" width="330" height="570" viewBox="0 0 330 570" role="img" aria-labelledby="title desc"><title id="title">事务与外部动作（移动端）</title><desc id="desc">状态和动作意图一起提交，外部动作提交后执行，失败重试。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#77746e"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#faf8f3"/><text x="16" y="29" font-size="18" fill="#292825" font-weight="600" text-anchor="start">事务保存，提交后执行</text><rect x="16" y="57" width="298" height="146" rx="5" fill="none" stroke="#e6e2da"/><text x="32" y="85" font-size="14" fill="#a64335" font-weight="600" text-anchor="start">同一个 SQLite 事务</text><text x="32" y="116" font-size="14" fill="#292825" font-weight="400" text-anchor="start">Decision · Ticket · Assignment</text><text x="32" y="145" font-size="14" fill="#292825" font-weight="400" text-anchor="start">Thread 订阅</text><text x="32" y="174" font-size="14" fill="#292825" font-weight="400" text-anchor="start">Effects / Outbox：待执行动作</text><polyline points="165,203 165,248" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="180" y="234" font-size="12" fill="#77746e" font-weight="400" text-anchor="start">提交成功</text><rect x="16" y="256" width="298" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="32" y="285" font-size="16" fill="#292825" font-weight="600" text-anchor="start">DshExecutor</text><text x="32" y="310" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">创建 / 找回 Worker，投递输入</text><polyline points="165,332 165,369" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="378" width="298" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="32" y="407" font-size="16" fill="#292825" font-weight="600" text-anchor="start">PR / 报告 / 回复</text><text x="32" y="432" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">PR / 飞书：不属于本地事务</text><text x="16" y="494" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">失败保留动作并重试；成功记录回执。</text><text x="16" y="519" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">稳定 ID 去重，generation 保护新动作。</text><text x="16" y="544" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">恢复时仍需核对远端真实状态。</text></g></svg>
