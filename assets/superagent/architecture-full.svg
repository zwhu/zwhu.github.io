troke="#e6e2da"/><text x="622" y="282" font-size="19" fill="#292825" font-weight="600" text-anchor="start">GitHub PR / Issue</text><text x="622" y="308" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">评审、评论与 PR 状态</text><rect x="1000" y="254" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="1022" y="282" font-size="19" fill="#292825" font-weight="600" text-anchor="start">CI / 自动事件</text><text x="1022" y="308" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">检查失败与恢复</text><rect x="200" y="484" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da" stroke-dasharray="6 4"/><text x="222" y="512" font-size="19" fill="#292825" font-weight="600" text-anchor="start">Trigger</text><text x="222" y="538" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">事件 ID、来源与原文</text><rect x="600" y="484" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da" stroke-dasharray="6 4"/><text x="622" y="512" font-size="19" fill="#292825" font-weight="600" text-anchor="start">Intake</text><text x="622" y="538" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">监听范围、保存与扇出</text><rect x="1000" y="484" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da" stroke-dasharray="6 4"/><text x="1022" y="512" font-size="19" fill="#292825" font-weight="600" text-anchor="start">Thread 订阅</text><text x="1022" y="538" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">讨论 → Ticket 的关联</text><rect x="200" y="714" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da" stroke-dasharray="6 4"/><text x="222" y="742" font-size="19" fill="#292825" font-weight="600" text-anchor="start">Candidate / Eval</text><text x="222" y="768" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">摘要、引用与待判断事件</text><rect x="600" y="714" width="380" height="82" rx="5" fill="#faf8f3" stroke="#a64335" stroke-dasharray="6 4"/><text x="622" y="742" font-size="19" fill="#292825" font-weight="600" text-anchor="start">Router 主会话</text><text x="622" y="768" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">accept · attach · stop · ignore</text><rect x="1000" y="714" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da" stroke-dasharray="6 4"/><text x="1022" y="742" font-size="19" fill="#292825" font-weight="600" text-anchor="start">按需读取</text><text x="1022" y="768" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">orchestrator_read / eval_read</text><rect x="200" y="944" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da" stroke-dasharray="6 4"/><text x="222" y="972" font-size="19" fill="#292825" font-weight="600" text-anchor="start">DshExecutor</text><text x="222" y="998" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">启动、投递与执行槽位</text><rect x="600" y="944" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="622" y="972" font-size="19" fill="#292825" font-weight="600" text-anchor="start">Worker 会话</text><text x="622" y="998" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">调查、实现与验证</text><rect x="1000" y="944" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="1022" y="972" font-size="19" fill="#292825" font-weight="600" text-anchor="start">PR / 报告 / 回复</text><text x="1022" y="998" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">交付结果与待决定问题</text><rect x="200" y="1174" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da" stroke-dasharray="6 4"/><text x="222" y="1202" font-size="19" fill="#292825" font-weight="600" text-anchor="start">Ticket / Assignment</text><text x="222" y="1228" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">原请求、授权与执行记录</text><rect x="600" y="1174" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da" stroke-dasharray="6 4"/><text x="622" y="1202" font-size="19" fill="#292825" font-weight="600" text-anchor="start">Effects / Outbox</text><text x="622" y="1228" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">待执行动作与回执</text><rect x="1000" y="1174" width="380" height="82" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="1022" y="1202" font-size="19" fill="#292825" font-weight="600" text-anchor="start">SQLite + 状态目录锁</text><text x="1022" y="1228" font-size="16" fill="#77746e" font-weight="400" text-anchor="start">事务、WAL 与 FULL 同步</text><g><text x="420" y="604" font-size="14" fill="#77746e" font-weight="400" text-anchor="start">需要判断</text></g><g><text x="452" y="834" font-size="14" fill="#77746e" font-weight="400" text-anchor="start">记录决定并分派</text></g><g transform="rotate(-90 1452 700)"><text x="1452" y="700" font-size="14" fill="#77746e" font-weight="400" text-anchor="middle">已订阅事件直通</text></g><g><text x="810" y="885" font-size="14" fill="#77746e" font-weight="400" text-anchor="start">handback / 报告</text></g><g transform="rotate(-90 91 1105)"><text x="91" y="1105" font-size="14" fill="#77746e" font-weight="400" text-anchor="middle">提交后执行 / 重试</text></g><text x="160" y="86" font-size="28" fill="#292825" font-weight="600" text-anchor="start">Super-agent：事件、任务与持续执行</text><text x="160" y="118" font-size="14" fill="#77746e" font-weight="400" text-anchor="start">读取摘要 → 判断归属 → 保存关系 → 执行与续办</text><text x="160" y="146" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">公开原型 6337fc8 · 实线：平台 / 基础设施 · 虚线：原型中的任务抽象</text><text x="160" y="1368" font-size="14" fill="#77746e" font-weight="400" text-anchor="start">直通仍可能通知 Router；同一业务目标的重复请求和不同 PR 冲突未被自动解决。</text><text x="160" y="1392" font-size="14" fill="#77746e" font-weight="400" text-anchor="start">本图为实现关系概览；箭头表示调用 / 关联，不表示所有操作存在一个跨系统事务。</text></g></svg>
