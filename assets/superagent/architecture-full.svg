<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1430" viewBox="0 0 1480 1430" role="img" aria-labelledby="title desc"><title id="title">Super-agent 系统架构</title><desc id="desc">五层架构和十八条调用或关联；详见文章中的分发、上下文、执行与一致性说明。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#77746e"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#faf8f3"/><rect x="160" y="200" width="1260" height="160" rx="5" fill="none" stroke="#e6e2da"/><text x="184" y="230" font-size="17" fill="#77746e" font-weight="400" text-anchor="start">事件来源</text><rect x="160" y="430" width="1260" height="160" rx="5" fill="none" stroke="#e6e2da"/><text x="184" y="460" font-size="17" fill="#77746e" font-weight="400" text-anchor="start">接收与归属</text><rect x="160" y="660" width="1260" height="160" rx="5" fill="none" stroke="#e6e2da"/><text x="184" y="690" font-size="17" fill="#77746e" font-weight="400" text-anchor="start">需要判断时调用 Router</text><rect x="160" y="890" width="1260" height="160" rx="5" fill="none" stroke="#e6e2da"/><text x="184" y="920" font-size="17" fill="#77746e" font-weight="400" text-anchor="start">执行与交付</text><rect x="160" y="1120" width="1260" height="160" rx="5" fill="none" stroke="#e6e2da"/><text x="184" y="1150" font-size="17" fill="#77746e" font-weight="400" text-anchor="start">本地持久状态</text><polyline points="390,336 390,396 790,396 790,478" fill="none" stroke="#77746e" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="790,336 790,396 790,478" fill="none" stroke="#77746e" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1190,336 1190,396 790,396 790,478" fill="none" stroke="#77746e" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="598,525 586,525" fill="none" stroke="#77746e" stroke-width="1.6" marker-end="url(#arrow)"/><polyline poin