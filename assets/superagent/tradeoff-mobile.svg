<svg xmlns="http://www.w3.org/2000/svg" width="410" height="503" viewBox="0 0 410 503" role="img" aria-labelledby="title desc"><title id="title">调度改善与缓存读取代价（移动端）</title><desc id="desc">与优先委派单会话比较，p95缩短约46%，缓存读取约为2.15倍；每方案5次，未测代码质量与人工收益。</desc><rect width="410" height="503" fill="#faf8f3"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="20" y="65" font-size="23" fill="#292825" font-weight="600" >慢端更快，缓存读取更多</text><line x1="20" y1="88" x2="390" y2="88" stroke="#d6d0c6"/><text x="20" y="118" font-size="14" fill="#77746e" font-weight="400" >p95 完成耗时</text><text x="20" y="151" font-size="13" fill="#77746e" font-weight="400" >单会话 · 优先委派</text><rect x="20" y="164" width="250" height="17" fill="#d6d0c6"/><text x="278" y="178" font-size="14" fill="#292825" font-weight="500" >29.0 分钟</text><text x="20" y="213" font-size="13" fill="#77746e" font-weight="400" >Super-agent</text><rect x="20" y="226" width="135.3448275862069" height="17" fill="#a64335"/><text x="163.3448275862069" y="240" font-size="14" fill="#292825" font-weight="500" >15.7 分钟</text><text x="20" y="272" font-size="15" fill="#a64335" font-weight="500" >约缩短 46%</text><line x1="20" y1="294" x2="390" y2="294" stroke="#d6d0c6"/><text x="20" y="326" font-size="14" fill="#77746e" font-weight="400" >缓存读取量</text><text x="20" y="359" font-size="13" fill="#77746e" font-weight="400" >单会话 · 优先委派</text><rect x="20" y="372" width="116" height="17" fill="#d6d0c6"/><text x="144" y="386" font-size="14" fill="#292825" font-weight="500" >1,082 万</text><text x="20" y="421" font-size="13" fill="#77746e" font-weight="400" >Super-agent</text><rect x="20" y="434" width="250" height="17" fill="#a64335"/><text x="278" y="448" font-size="14" fill="#292825" font-weight="500" >2,323 万</text><text x="20" y="480" font-size="15" fill="#a64335" font-weight="500" >约为 2.15 倍</text></g></svg>
