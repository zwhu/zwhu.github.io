-width="1.3"/><text x="30" y="766" font-size="16" fill="#a64335" font-weight="500" data-node="async-tool" data-max-width="300">后台异步执行耗时工具</text><rect x="15" y="851" width="157" height="86" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="30" y="879" font-size="16" fill="#292825" font-weight="500" data-node="inject" data-max-width="127">新消息投递</text><text x="30" y="909" font-size="13" fill="#77746e" font-weight="400" data-node="inject" data-max-width="127">完成结果</text><rect x="188" y="851" width="157" height="86" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="203" y="879" font-size="16" fill="#a64335" font-weight="500" data-node="deliver" data-max-width="127">LLM Call</text><text x="203" y="909" font-size="13" fill="#77746e" font-weight="400" data-node="deliver" data-max-width="127">交付任务结果</text><text x="15" y="27" font-size="18" fill="#292825" font-weight="400" >经典：等待工具结束</text><text x="15" y="396" font-size="18" fill="#292825" font-weight="400" >异步：前台继续接收输入</text></g></svg>
