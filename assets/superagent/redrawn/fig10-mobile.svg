<svg xmlns="http://www.w3.org/2000/svg" width="360" height="960" viewBox="0 0 360 960" role="img" aria-labelledby="title desc"><title id="title">同步与异步 ReAct Loop</title><desc id="desc">据 dsh 原文图 10 重绘。用户消息 1: ；LLM Call: 调用 run()；同步执行 耗时工具: ；工具调用结束: 返回结果；LLM Call: 回复用户；用户消息 1: ；LLM Call: 调用 start()；立即返回: Started 通知；用户消息 2: ；LLM Call: 即时回复；后台异步执行耗时工具: ；新消息投递: 完成结果；LLM Call: 交付任务结果。</desc><defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a64335" stroke-width="1.4"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#77746e" stroke-width="1.4"/></marker></defs><rect width="360" height="960" fill="#faf8f3"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><line x1="15" y1="362" x2="345" y2="362" stroke="#e6e2da"/><polyline points="93,95 93,117" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="172,160 188,160" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="266,202 266,225 93,225 93,247" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="172,290 188,290" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="93,202 93,247" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/><polyline points="93,467 93,490" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="172,531 188,531" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="266,572 266,594 93,594 93,616" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline point