<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620" role="img" aria-labelledby="title desc"><title id="title">计算、状态与执行环境分离</title><desc id="desc">据 DeepSeek Harness 原文图 11 重绘。Agent Loop: 云端无状态弹性容器；Session 数据库: 持久化状态存储；个人开发机: 轻量端侧 daemon；云端托管 / 按需环境: 轻量端侧 daemon；间歇在线的个人设备: 轻量端侧 daemon。重排版不改变作者设计与公开原型的区别。</desc><defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a64335" stroke-width="1.4"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#77746e" stroke-width="1.4"/></marker></defs><rect width="360" height="620" fill="#faf8f3"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><line x1="15" y1="259" x2="345" y2="259" stroke="#e6e2da" stroke-dasharray="5 5"/><polyline points="180,100 180,144" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)" marker-start="url(#arrow-muted)"/><polyline points="15,57 5,57 5,355 15,355" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="15,57 5,57 5,448 15,448" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="15,57 5,57 5,541 15,541" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><rect x="15" y="14" width="330" height="86" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="30" y="42" font-size="16" fill="#a64335" font-weight="500" data-node="loop" data-max-width="300">Agent Loop</text><text x="30" y="72" font-size="13" fill="#77746e" font-weight="400" data-node="loop" data-max-width="300">云端无状态弹性容器</text><rect x="15" y="144" width="330" height="85" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="30" y="172" font-size="16" fill="#292825" font-weight="500" data-node="db" data-max-width="300">Session 数据库</text><text x="30" y="202" font-size="13" fill="#77746e" font-weight="400" data-node="db" data-max-width="300">持久化状态存储</text><rect x="15" y="314" width="330" height="82" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="30" y="342" font-size="16" fill="#292825" font-weight="500" data-node="env0" data-max-width="300">个人开发机</text><text x="30" y="372" font-size="13" fill="#77746e" font-weight="400" data-node="env0" data-max-width="300">轻量端侧 daemon</text><rect x="15" y="407" width="330" height="82" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="30" y="435" font-size="16" fill="#292825" font-weight="500" data-node="env1" data-max-width="300">云端托管 / 按需环境</text><text x="30" y="465" font-size="13" fill="#77746e" font-weight="400" data-node="env1" data-max-width="300">轻量端侧 daemon</text><rect x="15" y="500" width="330" height="82" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="30" y="528" font-size="16" fill="#292825" font-weight="500" data-node="env2" data-max-width="300">间歇在线的个人设备</text><text x="30" y="558" font-size="13" fill="#77746e" font-weight="400" data-node="env2" data-max-width="300">轻量端侧 daemon</text><text x="16" y="284" font-size="13" fill="#77746e" font-weight="400" >执行环境留在原地，Loop 按需接入。</text></g></svg>
