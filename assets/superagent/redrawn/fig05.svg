<svg xmlns="http://www.w3.org/2000/svg" width="820" height="362" viewBox="0 0 820 362" role="img" aria-labelledby="title desc"><title id="title">两级过滤：先过规则，再读语义</title><desc id="desc">据 DeepSeek Harness 原文图 5 重绘。Trigger 1 · 非监听群: “中午去食堂还是外卖？”；Trigger 2 · 日常消息: “新版本界面看着挺清爽”；Trigger 3 · 缺陷反馈: “切换会话时偶发白屏”；程序层策略: Fast Path，确定性规则准入，群组范围 / 来源白名单，拦截 Trigger 1，放行 Trigger 2、3；语义层策略: Slow Path，LLM 按提示词判断语义，静默 2，触发 3；开始路由 Trigger 3: 。重排版不改变作者设计与公开原型的区别。</desc><defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a64335" stroke-width="1.4"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#77746e" stroke-width="1.4"/></marker></defs><rect width="820" height="362" fill="#faf8f3"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><polyline points="266,66 287,66 287,105 312,105" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="266,175 287,175 287,150 312,150" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="266,284 287,284 287,195 312,195" fill="none" stroke="#a64335" stroke-width="2" marker-end="url(#arrow-accent)"/><polyline points="548,156 584,156" fill="none" stroke="#a64335" stroke-width="2" marker-end="url(#arrow-accent)"/><polyline points="695,234 695,278" fill="none" stroke="#a64335" stroke-width="2" marker-end="url(#arrow-accent)"/><rect x="14" y="20" width="252" height="92" rx="3" fill="#f0ede6" stroke="#d6d0c6" stroke-width="0.8"/><text x="29" y="48" font-size="18" fill="#292825" font-weight="600" data-node="t0" data-max-width="222">Trigger 1 · 非监听群</text><text x="29" y="78" font-size="14" fill="#77746e" font-weight="400" data-node="t0" data-max-width="222">“中午去食堂还是外卖？”</text><rec