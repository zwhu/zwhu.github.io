<svg xmlns="http://www.w3.org/2000/svg" width="820" height="468" viewBox="0 0 820 468" role="img" aria-labelledby="title desc"><title id="title">Super-agent 整体设计</title><desc id="desc">据 DeepSeek Harness 原文图 3 重绘。[3] 环境事件: 群消息 / PR / CI；[3] 两级过滤: Fast / Slow Path；[2] Router 层: 共享上下文，全局路由与交互；[2] Worker 1: 隔离上下文；[2] Worker N: 隔离上下文；[4] 多信道交互: IM / GitHub / 邮件；[5] 执行环境: 轻量 daemon 原地接入；[5] Session 数据库: 持久化保存所有 Session 状态；[6] Watchdog: 外部监控与自愈。重排版不改变作者设计与公开原型的区别。</desc><defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a64335" stroke-width="1.4"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#77746e" stroke-width="1.4"/></marker></defs><rect width="820" height="468" fill="#faf8f3"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><polyline points="240,60 286,60" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="504,60 554,60" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="680,126 680,171" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="600,126 600,145 127,145 127,182" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="640,126 640,157 395,157 395,182" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="300,102 260,102 260,159 22,159 22,182" fill="none" stroke="#a64335" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-accent)"/><polyline points="804,123 815,123 815,417 806,417" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="127,266 127,345 306,345 306,383" fill="none" st