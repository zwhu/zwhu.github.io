<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc"><title id="title">两级过滤：先过规则，再读语义</title><desc id="desc">据 dsh 原文图 5 重绘。Trigger 1 · 非监听群: “中午去食堂还是外卖？”；Trigger 2 · 日常消息: “新版本界面看着挺清爽”；Trigger 3 · 缺陷反馈: “切换会话时偶发白屏”；程序层策略: Fast Path · 确定性规则准入，群组范围 / 来源白名单，拦截 Trigger 1；放行 2、3；语义层策略: Slow Path · LLM 读语义，静默 Trigger 2，触发 Trigger 3；开始路由 Trigger 3: 。</desc><defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a64335" stroke-width="1.4"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#77746e" stroke-width="1.4"/></marker></defs><rect width="360" height="760" fill="#faf8f3"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><polyline points="345,56 355,56 355,358 345,358" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="345,151 355,151 355,393 345,393" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="345,246 355,246 355,428 345,428" fill="none" stroke="#a64335" stroke-width="2" marker-end="url(#arrow-accent)"/><polyline points="180,496 180,541" fill="none" stroke="#a64335" stroke-width="2" marker-end="url(#arrow-accent)"/><polyline points="180,655 180,699" fill="none" stroke="#a64335" stroke-width="2" marker-end="url(#arrow-accent)"/><rect x="15" y="15" width="330" height="82" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="30" y="43" font-size="16" fill="#292825" font-weight="500" data-node="t0" data-max-width="300">Trigger 1 · 非监听群</text><text x="30" y="73" font-size="13" fill="#77746e" font-weight="400" data-node="t0" data-max-width="300">“中午去食堂还是外卖？”</text><rect x="15" y="110" width="330" height="82" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="30" y="138" font-size="16" fill="#292825" font-weight="500" data-node="t1" data-max-width="300">Trigger 2 · 日常消息</text><text x="30" y="168" font-size="13" fill="#77746e" font-weight="400" data-node="t1" data-max-width="300">“新版本界面看着挺清爽”</text><rect x="15" y="205" width="330" height="82" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="30" y="233" font-size="16" fill="#a64335" font-weight="500" data-node="t2" data-max-width="300">Trigger 3 · 缺陷反馈</text><text x="30" y="263" font-size="13" fill="#77746e" font-weight="400" data-node="t2" data-max-width="300">“切换会话时偶发白屏”</text><rect x="15" y="325" width="330" height="171" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="30" y="353" font-size="16" fill="#a64335" font-weight="500" data-node="program" data-max-width="300">程序层策略</text><text x="30" y="383" font-size="13" fill="#77746e" font-weight="400" data-node="program" data-max-width="300">Fast Path · 确定性规则准入</text><text x="30" y="405" font-size="13" fill="#77746e" font-weight="400" data-node="program" data-max-width="300">群组范围 / 来源白名单</text><text x="30" y="427" font-size="13" fill="#77746e" font-weight="400" data-node="program" data-max-width="300">拦截 Trigger 1；放行 2、3</text><rect x="15" y="541" width="330" height="114" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="30" y="569" font-size="16" fill="#292825" font-weight="500" data-node="semantic" data-max-width="300">语义层策略</text><text x="30" y="599" font-size="13" fill="#77746e" font-weight="400" data-node="semantic" data-max-width="300">Slow Path · LLM 读语义</text><text x="30" y="621" font-size="13" fill="#77746e" font-weight="400" data-node="semantic" data-max-width="300">静默 Trigger 2，触发 Trigger 3</text><rect x="15" y="699" width="330" height="55" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="30" y="727" font-size="16" fill="#a64335" font-weight="500" data-node="result" data-max-width="300">开始路由 Trigger 3</text><text x="20" y="522" font-size="13" fill="#a64335" font-weight="400" paint-order="stroke" stroke="#faf8f3" stroke-width="4" stroke-linejoin="round">候选事件</text></g></svg>
