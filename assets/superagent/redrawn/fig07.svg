<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc"><title id="title">订阅与直通：初始判断，后续投递</title><desc id="desc">据 dsh 原文图 7 重绘。同一 Thread 的事件: 例如同一 PR 或 IM 话题；Router 层: 创建 Worker 并建立订阅；Worker Session: 已订阅该 Thread。</desc><defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a64335" stroke-width="1.4"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#77746e" stroke-width="1.4"/></marker></defs><rect width="760" height="260" fill="#faf8f3"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><polyline points="120,144 120,56 268,56" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/><polyline points="512,56 646,56 646,144" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/><polyline points="226,189 548,189" fill="none" stroke="#a64335" stroke-width="2" marker-end="url(#arrow-accent)"/><rect x="16" y="144" width="210" height="88" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="31" y="172" font-size="17" fill="#292825" font-weight="500" data-node="thread" data-max-width="180">同一 Thread 的事件</text><text x="31" y="202" font-size="14" fill="#77746e" font-weight="400" data-node="thread" data-max-width="180">例如同一 PR 或 IM 话题</text><rect x="268" y="14" width="244" height="84" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="283" y="42" font-size="17" fill="#292825" font-weight="500" data-node="router" data-max-width="214">Router 层</text><text x="283" y="72" font-size="14" fill="#77746e" font-weight="400" data-node="router" data-max-width="214">创建 Worker 并建立订阅</text><rect x="548" y="144" width="196" height="88" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="563" y="172" font-size="17" fill="#a64335" font-weight="500" data-node="worker" data-max-width="166">Worker Session</text><text x="563" y="202" font-size="14" fill="#77746e" font-weight="400" data-node="worker" data-max-width="166">已订阅该 Thread</text><text x="34" y="120" font-size="13" fill="#77746e" font-weight="400" paint-order="stroke" stroke="#faf8f3" stroke-width="4" stroke-linejoin="round">初始事件 · Slow Path</text><text x="242" y="175" font-size="13" fill="#a64335" font-weight="400" paint-order="stroke" stroke="#faf8f3" stroke-width="4" stroke-linejoin="round">后续事件直通 · Fast Path</text></g></svg>
