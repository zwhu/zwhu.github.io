<svg xmlns="http://www.w3.org/2000/svg" width="360" height="972" viewBox="0 0 360 972" role="img" aria-labelledby="title desc"><title id="title">Super-agent 整体设计</title><desc id="desc">据 DeepSeek Harness 原文图 3 重绘。[3] 环境事件: 群消息 / PR / CI；[3] 两级过滤: Fast / Slow Path；[2] Router 层: 共享上下文，全局路由与交互；[4] 多信道交互: IM / GitHub / 邮件；[2] Worker 1: 隔离上下文；[2] Worker N: 隔离上下文；[5] 执行环境: 轻量 daemon 原地接入；[5] Session 数据库: 持久化保存所有 Session 状态；[6] Watchdog: 外部监控与自愈。重排版不改变作者设计与公开原型的区别。</desc><defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a64335" stroke-width="1.4"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#77746e" stroke-width="1.4"/></marker></defs><rect width="360" height="972" fill="#faf8f3"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><polyline points="180,94 180,116" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="180,196 180,218" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="180,306 180,320" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="18,262 9,262 9,462 18,462" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="18,262 9,262 9,564 18,564" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="342,156 351,156 351,462 342,462" fill="none" stroke="#a64335" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-accent)"/><polyline points="342,262 351,262 351,768 342,768" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="18,462 9,462 9,768 18,768" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="18,564 9,564 9,768 18,768" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="180,604 180,626" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="180,830 180,808" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/><rect x="18" y="14" width="324" height="80" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="33" y="42" font-size="16" fill="#292825" font-weight="500" data-node="trigger" data-max-width="294">[3] 环境事件</text><text x="33" y="72" font-size="13" fill="#77746e" font-weight="400" data-node="trigger" data-max-width="294">群消息 / PR / CI</text><rect x="18" y="116" width="324" height="80" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="33" y="144" font-size="16" fill="#292825" font-weight="500" data-node="filter" data-max-width="294">[3] 两级过滤</text><text x="33" y="174" font-size="13" fill="#77746e" font-weight="400" data-node="filter" data-max-width="294">Fast / Slow Path</text><rect x="18" y="218" width="324" height="88" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="33" y="246" font-size="16" fill="#a64335" font-weight="500" data-node="router" data-max-width="294">[2] Router 层</text><text x="33" y="276" font-size="13" fill="#77746e" font-weight="400" data-node="router" data-max-width="294">共享上下文，全局路由与交互</text><rect x="18" y="320" width="324" height="80" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="33" y="348" font-size="16" fill="#292825" font-weight="500" data-node="channels" data-max-width="294">[4] 多信道交互</text><text x="33" y="378" font-size="13" fill="#77746e" font-weight="400" data-node="channels" data-max-width="294">IM / GitHub / 邮件</text><rect x="18" y="422" width="324" height="80" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="33" y="450" font-size="16" fill="#292825" font-weight="500" data-node="w1" data-max-width="294">[2] Worker 1</text><text x="33" y="480" font-size="13" fill="#77746e" font-weight="400" data-node="w1" data-max-width="294">隔离上下文</text><rect x="18" y="524" width="324" height="80" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="33" y="552" font-size="16" fill="#292825" font-weight="500" data-node="wn" data-max-width="294">[2] Worker N</text><text x="33" y="582" font-size="13" fill="#77746e" font-weight="400" data-node="wn" data-max-width="294">隔离上下文</text><rect x="18" y="626" width="324" height="80" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8" stroke-dasharray="5 4"/><text x="33" y="654" font-size="16" fill="#292825" font-weight="500" data-node="env" data-max-width="294">[5] 执行环境</text><text x="33" y="684" font-size="13" fill="#77746e" font-weight="400" data-node="env" data-max-width="294">轻量 daemon 原地接入</text><rect x="18" y="728" width="324" height="80" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="33" y="756" font-size="16" fill="#292825" font-weight="500" data-node="db" data-max-width="294">[5] Session 数据库</text><text x="33" y="786" font-size="13" fill="#77746e" font-weight="400" data-node="db" data-max-width="294">持久化保存所有 Session 状态</text><rect x="18" y="830" width="324" height="80" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="33" y="858" font-size="16" fill="#292825" font-weight="500" data-node="watchdog" data-max-width="294">[6] Watchdog</text><text x="33" y="888" font-size="13" fill="#77746e" font-weight="400" data-node="watchdog" data-max-width="294">外部监控与自愈</text><text x="18" y="952" font-size="12" fill="#77746e" font-weight="400" >章节号沿用原文；不表示公开版已全实现。</text></g></svg>
