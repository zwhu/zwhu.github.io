<svg xmlns="http://www.w3.org/2000/svg" width="360" height="472" viewBox="0 0 360 472" role="img" aria-labelledby="title desc"><title id="title">订阅与直通：初始判断，后续投递</title><desc id="desc">据 dsh 原文图 7 重绘。同一 Thread 的事件: 例如同一 PR 或 IM 话题；Router 层: 创建 Worker 并建立订阅；Worker Session: 已订阅该 Thread。</desc><defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a64335" stroke-width="1.4"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#77746e" stroke-width="1.4"/></marker></defs><rect width="360" height="472" fill="#faf8f3"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><polyline points="180,100 180,153" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/><polyline points="180,239 180,319" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/><polyline points="345,57 355,57 355,362 345,362" fill="none" stroke="#a64335" stroke-width="2" marker-end="url(#arrow-accent)"/><rect x="15" y="14" width="330" height="86" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="30" y="42" font-size="16" fill="#292825" font-weight="500" data-node="thread" data-max-width="300">同一 Thread 的事件</text><text x="30" y="72" font-size="13" fill="#77746e" font-weight="400" data-node="thread" data-max-width="300">例如同一 PR 或 IM 话题</text><rect x="15" y="153" width="330" height="86" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="30" y="181" font-size="16" fill="#292825" font-weight="500" data-node="router" data-max-width="300">Router 层</text><text x="30" y="211" font-size="13" fill="#77746e" font-weight="400" data-node="router" data-max-width="300">创建 Worker 并建立订阅</text><rect x="15" y="319" width="330" height="86" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="30" y="347" font-size="16" fill="#a64335" font-weight="500" data-node="worker" data-max-width="300">Worker Session</text><text x="30" y="377" font-size="13" fill="#77746e" font-weight="400" data-node="worker" data-max-width="300">已订阅该 Thread</text><text x="22" y="134" font-size="13" fill="#77746e" font-weight="400" paint-order="stroke" stroke="#faf8f3" stroke-width="4" stroke-linejoin="round">初始事件 · Slow Path</text><text x="23" y="285" font-size="13" fill="#77746e" font-weight="400" paint-order="stroke" stroke="#faf8f3" stroke-width="4" stroke-linejoin="round">创建并订阅</text><text x="20" y="443" font-size="14" fill="#a64335" font-weight="400" >朱砂红路径：后续事件直接投递。</text></g></svg>
