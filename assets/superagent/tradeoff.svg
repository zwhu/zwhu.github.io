<svg xmlns="http://www.w3.org/2000/svg" width="840" height="404" viewBox="0 0 840 404" role="img" aria-labelledby="title desc"><title id="title">调度改善与缓存读取代价</title><desc id="desc">与优先委派单会话比较，Super-agent p95从29.0到15.7分钟，缓存读取从1082到2323万token。分别使用相同量尺，不比较两种单位的条形长度。</desc><rect width="840" height="404" fill="#faf8f3"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="27" font-size="15" fill="#77746e" font-weight="400" >同一个对照，两种代价</text><text x="24" y="62" font-size="27" fill="#292825" font-weight="600" >慢端完成更快，缓存读取更多</text><line x1="24" y1="85" x2="816" y2="85" stroke="#d6d0c6"/><line x1="423" y1="107" x2="423" y2="289" stroke="#d6d0c6"/><text x="24" y="122" font-size="15" fill="#77746e" font-weight="400" >p95 完成耗时</text><text x="456" y="122" font-size="15" fill="#77746e" font-weight="400" >缓存读取量</text><text x="24" y="161" font-size="13" fill="#77746e" font-weight="400" >单会话 · 优先委派</text><rect x="24" y="174" width="310" height="17" fill="#d6d0c6"/><text x="342" y="188" font-size="14" fill="#292825" font-weight="500" >29.0 分钟</text><text x="24" y="233" font-size="13" fill="#77746e" font-weight="400" >Super-agent</text><rect x="24" y="246" width="167.82758620689654" height="17" fill="#a64335"/><text x="199.82758620689654" y="260" font-size="14" fill="#292825" font-weight="500" >15.7 分钟</text><text x="456" y="161" font-size="13" fill="#77746e" font-weight="400" >单会话 · 优先委派</text><rect x="456" y="174" width="137" height="17" fill="#d6d0c6"/><text x="601" y="188" font-size="14" fill="#292825" font-weight="500" >1,082 万</text><text x="456" y="233" font-size="13" fill="#77746e" font-weight="400" >Super-agent</text><rect x="456" y="246" width="295" height="17" fill="#a64335"/><text x="759" y="260" font-size="14" fill="#292825" font-weight="500" >2,323 万</text><text x="24" y="304" font-size="16" fill="#a64335" font-weight="500" >约缩短 46%</text><text x="456" y="304" font-size="16" fill="#a64335" font-weight="500" >约为 2.15 倍</text><line x1="24" y1="326" x2="816" y2="326" stroke="#d6d0c6"/><text x="24" y="352" font-size="13" fill="#77746e" font-weight="400" >原文第 7.1 节，每方案 5 次 · 编码以耗时工具替代</text><text x="24" y="377" font-size="13" fill="#77746e" font-weight="400" >缓存读取不是总账单；未测真实代码质量与人工时间。</text></g></svg>
