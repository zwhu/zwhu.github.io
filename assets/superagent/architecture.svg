<svg xmlns="http://www.w3.org/2000/svg" width="600" height="510" viewBox="0 0 600 510" role="img" aria-labelledby="title desc"><title id="title">Super-agent 分发架构</title><desc id="desc">Intake 查询 Thread 订阅，已知消息直达 Worker；待判断消息由 Router 选择任务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#77746e"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#faf8f3"/><text x="24" y="32" font-size="19" fill="#292825" font-weight="600" text-anchor="start">事件按任务关系分发</text><rect x="24" y="72" width="248" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="40" y="101" font-size="16" fill="#292825" font-weight="600" text-anchor="start">Intake</text><text x="40" y="126" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">保存事件、查订阅</text><rect x="328" y="72" width="248" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="344" y="101" font-size="16" fill="#292825" font-weight="600" text-anchor="start">Thread 订阅</text><text x="344" y="126" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">保存讨论与任务的关系</text><rect x="24" y="222" width="248" height="76" rx="5" fill="#faf8f3" stroke="#a64335"/><text x="40" y="251" font-size="16" fill="#292825" font-weight="600" text-anchor="start">Router 主会话</text><text x="40" y="276" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">新请求或关联不明时判断</text><rect x="328" y="222" width="248" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="344" y="251" font-size="16" fill="#292825" font-weight="600" text-anchor="start">Worker 会话</text><text x="344" y="276" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">原任务继续调查、修改与验证</text><rect x="24" y="372" width="248" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="40" y="401" font-size="16" fill="#292825" font-weight="600" text-anchor="start">Ticket / Assignment</text><text x="40" y="426" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">原请求、授权与执行轮次</text><rect x="328" y="372" width="248" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="344" y="401" font-size="16" fill="#292825" font-weight="600" text-anchor="start">PR / 报告 / 回复</text><text x="344" y="426" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">验证后报告；必要时询问人</text><polyline points="272,110 322,110" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="284" y="99" font-size="12" fill="#77746e" font-weight="400" text-anchor="start">查询</text><polyline points="145,148 145,216" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="155" y="184" font-size="12" fill="#77746e" font-weight="400" text-anchor="start">待判断候选</text><polyline points="452,148 452,216" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="462" y="184" font-size="12" fill="#77746e" font-weight="400" text-anchor="start">已有订阅直通</text><polyline points="272,260 322,260" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="284" y="249" font-size="12" fill="#77746e" font-weight="400" text-anchor="start">分派</text><polyline points="145,298 145,366" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="155" y="335" font-size="12" fill="#77746e" font-weight="400" text-anchor="start">事务保存</text><polyline points="452,298 452,366" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="462" y="335" font-size="12" fill="#77746e" font-weight="400" text-anchor="start">产物与状态</text><text x="24" y="486" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">Router 与 Worker 各有上下文；程序保存关联，详细执行由 Worker 负责。</text></g></svg>
