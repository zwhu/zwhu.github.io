<svg xmlns="http://www.w3.org/2000/svg" width="330" height="798" viewBox="0 0 330 798" role="img" aria-labelledby="title desc"><title id="title">Super-agent 分发关系（移动端）</title><desc id="desc">已有订阅直通；需要判断的请求进入 Router。各节点说明见正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#77746e"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#faf8f3"/><text x="16" y="29" font-size="18" fill="#292825" font-weight="600" text-anchor="start">事件按任务关系分发</text><rect x="16" y="60" width="298" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="32" y="89" font-size="16" fill="#292825" font-weight="600" text-anchor="start">Intake</text><text x="32" y="114" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">保存事件，查询讨论订阅</text><polyline points="165,136 165,165" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="172" width="298" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="32" y="201" font-size="16" fill="#292825" font-weight="600" text-anchor="start">Thread 订阅</text><text x="32" y="226" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">已有订阅：直通原 Worker</text><polyline points="165,248 165,277" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="284" width="298" height="76" rx="5" fill="#faf8f3" stroke="#a64335"/><text x="32" y="313" font-size="16" fill="#292825" font-weight="600" text-anchor="start">Router 主会话</text><text x="32" y="338" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">新请求 / 关联不明：模型判断</text><polyline points="165,360 165,389" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="396" width="298" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="32" y="425" font-size="16" fill="#292825" font-weight="600" text-anchor="start">Worker 会话</text><text x="32" y="450" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">接收补充，调查、修改与验证</text><polyline points="165,472 165,501" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="508" width="298" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="32" y="537" font-size="16" fill="#292825" font-weight="600" text-anchor="start">Ticket / Assignment</text><text x="32" y="562" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">持久保存目标、授权与执行轮次</text><polyline points="165,584 165,613" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="620" width="298" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="32" y="649" font-size="16" fill="#292825" font-weight="600" text-anchor="start">PR / 报告 / 回复</text><text x="32" y="674" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">报告结果；问题交回 Router</text><text x="16" y="755" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">步骤展示两条分发路径，</text><text x="16" y="776" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">已订阅消息可跳过 Router 判断。</text></g></svg>
