<svg xmlns="http://www.w3.org/2000/svg" width="330" height="660" viewBox="0 0 330 660" role="img" aria-labelledby="title desc" data-graph-type="flowchart">
<title id="title">一篇文章的九步</title>
<desc id="desc">单列流程图：九步从定题到在线确认，第 03、05 步由我审阅。右侧虚线是回头路：意见在 03 当轮改，正文要改回 03，图要改回 04，CI 失败或冲突回 05。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#77746e"/></marker></defs>
<rect width="330" height="660" fill="#faf8f3" data-graph-role="background"/>
<text x="16" y="28" font-size="17" font-weight="500" text-anchor="start" fill="#292825">一篇文章的九步</text>
<text x="16" y="50" font-size="12" font-weight="400" text-anchor="start" fill="#77746e">红框两步由我审阅，虚线是回头路</text>
<rect id="m01" data-node-id="m01" data-graph-role="node" data-graph-bounds="16,75,236,121" x="16" y="75" width="220" height="46" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="126.0" y="95.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">01 定题、找资料</text>
<text x="126.0" y="112.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">我定问题，Agent 找资料</text>
<rect id="m02" data-node-id="m02" data-graph-role="node" data-graph-bounds="16,137,236,183" x="16" y="137" width="220" height="46" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="126.0" y="157.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">02 建独立工作区</text>
<text x="126.0" y="174.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">Agent · 读规范和原稿</text>
<rect id="m03" data-node-id="m03" data-graph-role="node" data-graph-bounds="16,199,236,245" x="16" y="199" width="220" height="46" rx="4" fill="#faf8f3" stroke="#a64335" stroke-width="1.6"/>
<text x="126.0" y="219.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">03 写正文，我通读</text>
<text x="126.0" y="236.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">Agent 当轮改稿、记意见</text>
<rect id="m04" data-node-id="m04" data-graph-role="node" data-graph-bounds="16,261,236,307" x="16" y="261" width="220" height="46" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="126.0" y="281.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">04 排版与配图</text>
<text x="126.0" y="298.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">Agent · 沿用视觉规范</text>
<rect id="m05" data-node-id="m05" data-graph-role="node" data-graph-bounds="16,323,236,369" x="16" y="323" width="220" height="46" rx="4" fill="#faf8f3" stroke="#a64335" stroke-width="1.6"/>
<text x="126.0" y="343.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">05 生成检查，我看整页</text>
<text x="126.0" y="360.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">Agent 跑 verify.py、预览</text>
<rect id="m06" data-node-id="m06" data-graph-role="node" data-graph-bounds="16,385,236,431" x="16" y="385" width="220" height="46" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="126.0" y="405.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">06 提交本篇，开 PR</text>
<text x="126.0" y="422.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">Agent · 只暂存本篇文件</text>
<rect id="m07" data-node-id="m07" data-graph-role="node" data-graph-bounds="16,447,236,493" x="16" y="447" width="220" height="46" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="126.0" y="467.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">07 CI 检查</text>
<text x="126.0" y="484.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">GitHub · check 通过</text>
<rect id="m08" data-node-id="m08" data-graph-role="node" data-graph-bounds="16,509,236,555" x="16" y="509" width="220" height="46" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="126.0" y="529.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">08 合并，Pages 发布</text>
<text x="126.0" y="546.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">我点合并，GitHub 发布</text>
<rect id="m09" data-node-id="m09" data-graph-role="node" data-graph-bounds="16,571,236,617" x="16" y="571" width="220" height="46" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="126.0" y="591.0" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">09 在线确认</text>
<text x="126.0" y="608.0" font-size="11" font-weight="400" text-anchor="middle" fill="#77746e">Agent · 交付正式链接</text>
<path id="f01" data-edge-id="f01" data-graph-role="edge" d="M126 121 L126 137" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow)"/>
<path id="f02" data-edge-id="f02" data-graph-role="edge" d="M126 183 L126 199" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow)"/>
<path id="f03" data-edge-id="f03" data-graph-role="edge" d="M126 245 L126 261" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow)"/>
<path id="f04" data-edge-id="f04" data-graph-role="edge" d="M126 307 L126 323" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow)"/>
<path id="f05" data-edge-id="f05" data-graph-role="edge" d="M126 369 L126 385" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow)"/>
<path id="f06" data-edge-id="f06" data-graph-role="edge" d="M126 431 L126 447" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow)"/>
<path id="f07" data-edge-id="f07" data-graph-role="edge" d="M126 493 L126 509" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow)"/>
<path id="f08" data-edge-id="f08" data-graph-role="edge" d="M126 555 L126 571" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow)"/>
<path id="b03" data-edge-id="b03" data-graph-role="edge" d="M236 214 L254 214 L254 230 L236 230" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="260" y="226" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">意见</text>
<path id="b04" data-edge-id="b04" data-graph-role="edge" d="M236 338 L262 338 L262 284 L236 284" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="268" y="319" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">图</text>
<path id="b05" data-edge-id="b05" data-graph-role="edge" d="M236 350 L296 350 L296 238 L236 238" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="302" y="282" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">正</text>
<text x="302" y="296" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">文</text>
<path id="b07" data-edge-id="b07" data-graph-role="edge" d="M236 470 L262 470 L262 362 L236 362" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="268" y="406" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">失败</text>
<text x="268" y="420" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">冲突</text>
<rect x="16" y="637" width="18" height="11" rx="2" fill="#faf8f3" stroke="#a64335" stroke-width="1.6"/>
<text x="42" y="646" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">我审阅</text>
<path d="M106 642H128" stroke="#77746e"/>
<text x="136" y="646" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">往下走</text>
<path d="M200 642H222" stroke="#77746e" stroke-dasharray="4 3"/>
<text x="230" y="646" font-size="11" font-weight="400" text-anchor="start" fill="#77746e">回头改</text>
</svg>
