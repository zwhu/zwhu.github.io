<text x="120.0" y="605.0" font-size="15" font-weight="500" text-anchor="middle" fill="#292825">点合并</text>
<text x="120.0" y="622.0" font-size="12" font-weight="400" text-anchor="middle" fill="#77746e">或开启自动合并</text>
<rect id="n08" data-node-id="n08" data-graph-role="node" data-graph-bounds="500,586,668,630" x="500" y="586" width="168" height="44" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="584.0" y="605.0" font-size="15" font-weight="500" text-anchor="middle" fill="#292825">08 合并 main</text>
<text x="584.0" y="622.0" font-size="12" font-weight="400" text-anchor="middle" fill="#77746e">Pages 自动发布</text>
<rect id="n09" data-node-id="n09" data-graph-role="node" data-graph-bounds="268,652,436,696" x="268" y="652" width="168" height="44" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
