<text x="352" y="102" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">Agent</text>
<text x="584" y="102" font-size="14" font-weight="500" text-anchor="middle" fill="#292825">GitHub</text>
<rect id="n01" data-node-id="n01" data-graph-role="node" data-graph-bounds="36,124,436,168" x="36" y="124" width="400" height="44" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="236.0" y="143.0" font-size="15" font-weight="500" text-anchor="middle" fill="#292825">01 定题、找资料</text>
<text x="236.0" y="160.0" font-size="12" font-weight="400" text-anchor="middle" fill="#77746e">我定问题和例子，Agent 找资料、核对出处</text>
<rect id="n02" data-node-id="n02" data-graph-role="node" data-graph-bounds="268,190,436,234" x="268" y="190" width="168" height="44" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="352.0" y="209.0" font-size="15" font-weight="500" text-anchor="middle" fill="#292825">02 建独立工作区</text>
<text x="352.0" y="226.0" font-size="12" font-weight="400" text-anchor="middle" fill="#77746e">读规范、偏好和原稿</text>
<rect id="n03" data-node-id="n03" data-graph-role="node" data-graph-bounds="268,256,436,300" x="268" y="256" width="168" height="44" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="352.0" y="275.0" font-size="15" font-weight="500" text-anchor="middle" fill="#292825">03 写正文</text>
<text x="352.0" y="292.0" font-size="12" font-weight="400" text-anchor="middle" fill="#77746e">当轮改稿，记下意见</text>
