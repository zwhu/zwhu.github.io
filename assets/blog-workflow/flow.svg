<text x="120.0" y="292.0" font-size="12" font-weight="400" text-anchor="middle" fill="#77746e">提修改意见</text>
<rect id="n04" data-node-id="n04" data-graph-role="node" data-graph-bounds="268,322,436,366" x="268" y="322" width="168" height="44" rx="4" fill="#faf8f3" stroke="#e6e2da"/>
<text x="352.0" y="341.0" font-size="15" font-weight="500" text-anchor="middle" fill="#292825">04 排版与配图</text>
<text x="352.0" y="358.0" font-size="12" font-weight="400" text-anchor="middle" fill="#77746e">沿用视觉规范</text>
