<svg xmlns="http://www.w3.org/2000/svg" width="704" height="744" viewBox="0 0 704 744" role="img" aria-labelledby="title desc" data-graph-type="flowchart">
<title id="title">一篇文章的九步</title>
<desc id="desc">三条泳道的流程图：我、Agent、GitHub。九步从定题到在线确认；我在第 03 步通读正文、第 05 步看整页，最后点合并。虚线是回头路：正文要改回 03，图要改回 04，CI 失败或冲突修好后回 05。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#77746e"/></marker></defs>
<rect width="704" height="744" fill="#faf8f3" data-graph-role="background"/>
<text x="24" y="32" font-size="19" font-weight="500" text-anchor="start" fill="#292825">一篇文章的九步</text>
<text x="24" y="57" font-size="13" font-weight="400" text-anchor="start" fill="#77746e">我审两次稿、点一次合并；其余由 Agent 执行，GitHub 把关和发布</text>
<path d="M236 82V700" stroke="#e6e2da"/>
<path d="M468 82V700" stroke="#e6e2da"/>
