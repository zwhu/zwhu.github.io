<svg xmlns="http://www.w3.org/2000/svg" width="600" height="483" viewBox="0 0 600 483" role="img" aria-labelledby="title desc"><title id="title">事务与持久动作队列</title><desc id="desc">事务内同时保存状态与动作意图，提交后执行外部操作，失败保留并重试。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#77746e"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect width="100%" height="100%" fill="#faf8f3"/><text x="24" y="32" font-size="19" fill="#292825" font-weight="600" text-anchor="start">记录与外部执行分开，失败可恢复</text><rect x="24" y="65" width="552" height="135" rx="5" fill="none" stroke="#e6e2da"/><text x="42" y="92" font-size="13" fill="#a64335" font-weight="600" text-anchor="start">同一个 SQLite 事务</text><text x="42" y="124" font-size="15" fill="#292825" font-weight="400" text-anchor="start">Decision · Ticket · Assignment · Thread 订阅</text><text x="42" y="159" font-size="15" fill="#292825" font-weight="400" text-anchor="start">Effects / Outbox：保存待执行动作和消息</text><polyline points="300,200 300,246" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="312" y="228" font-size="12" fill="#77746e" font-weight="400" text-anchor="start">提交成功后执行</text><rect x="24" y="252" width="248" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="40" y="281" font-size="16" fill="#292825" font-weight="600" text-anchor="start">DshExecutor</text><text x="40" y="306" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">创建 / 找回 Worker，投递输入</text><rect x="328" y="252" width="248" height="76" rx="5" fill="#faf8f3" stroke="#e6e2da"/><text x="344" y="281" font-size="16" fill="#292825" font-weight="600" text-anchor="start">PR / 报告 / 回复</text><text x="344" y="306" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">外部请求与任务库没有共同事务</text><polyline points="145,328 145,379 300,379 300,402" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="185" y="367" font-size="12" fill="#77746e" font-weight="400" text-anchor="start">失败留队列；成功记录回执</text><polyline points="452,328 452,379 300,379" fill="none" stroke="#77746e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="432" font-size="14" fill="#77746e" font-weight="400" text-anchor="start">稳定 ID 防重复；generation 防旧回调清除新动作。</text><text x="24" y="459" font-size="13" fill="#77746e" font-weight="400" text-anchor="start">提交前重查当前任务 / 评估；业务判断错误仍可能建立重复任务。</text></g></svg>
