<svg xmlns="http://www.w3.org/2000/svg" width="820" height="606" viewBox="0 0 820 606" role="img" aria-labelledby="title desc"><title id="title">同步与异步 ReAct Loop</title><desc id="desc">据 dsh 原文图 10 重绘。用户消息 1: ；LLM Call: 调用 run()；工具调用结束: 返回结果；LLM Call: 回复用户；同步执行耗时工具: ；用户消息 1: ；LLM Call: 调用 start()；立即返回: Started 通知；用户消息 2: ；LLM Call: 即时回复；后台异步执行耗时工具: ；新消息投递: 完成结果；LLM Call: 交付任务结果。</desc><defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a64335" stroke-width="1.4"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#77746e" stroke-width="1.4"/></marker></defs><rect width="820" height="606" fill="#faf8f3"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><line x1="14" y1="244" x2="806" y2="244" stroke="#e6e2da"/><polyline points="168,80 203,80" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="280,135 280,154" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="620,154 620,135" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="684,80 710,80" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="363,80 544,80" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/><polyline points="152,340 174,340" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="319,340 341,340" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="473,340 495,340" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="627,340 649,340" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="247,385 247,456" fill="none" stroke="#a64335" stroke-width="2" marker-end="url(#arrow-accent)"/><polyline points="390,456 390,412 407,412 407,385" fill="none" stroke="#77746e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/><polyline points="473,496 495,496" fill="none" stroke="#a64335" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-accent)"/><polyline points="732,385 732,419 563,419 563,456" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><polyline points="627,496 649,496" fill="none" stroke="#77746e" stroke-width="1.3" marker-end="url(#arrow-muted)"/><rect x="14" y="45" width="154" height="68" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="29" y="73" font-size="17" fill="#292825" font-weight="500" data-node="sync-msg" data-max-width="124">用户消息 1</text><rect x="203" y="45" width="160" height="90" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="218" y="73" font-size="17" fill="#292825" font-weight="500" data-node="run" data-max-width="130">LLM Call</text><text x="218" y="103" font-size="14" fill="#77746e" font-weight="400" data-node="run" data-max-width="130">调用 run()</text><rect x="544" y="45" width="140" height="90" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="559" y="73" font-size="17" fill="#292825" font-weight="500" data-node="sync-result" data-max-width="110">工具调用结束</text><text x="559" y="103" font-size="14" fill="#77746e" font-weight="400" data-node="sync-result" data-max-width="110">返回结果</text><rect x="710" y="45" width="96" height="108" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="725" y="73" font-size="17" fill="#292825" font-weight="500" data-node="sync-llm" data-max-width="66">LLM</text><text x="725" y="97" font-size="17" fill="#292825" font-weight="500" data-node="sync-llm" data-max-width="66">Call</text><text x="725" y="127" font-size="14" fill="#77746e" font-weight="400" data-node="sync-llm" data-max-width="66">回复用户</text><rect x="203" y="154" width="481" height="64" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="218" y="182" font-size="17" fill="#292825" font-weight="500" data-node="sync-tool" data-max-width="451">同步执行耗时工具</text><rect x="14" y="295" width="138" height="90" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="29" y="323" font-size="17" fill="#a64335" font-weight="500" data-node="async-msg" data-max-width="108">用户消息 1</text><rect x="174" y="295" width="145" height="90" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="189" y="323" font-size="17" fill="#a64335" font-weight="500" data-node="start" data-max-width="115">LLM Call</text><text x="189" y="353" font-size="14" fill="#77746e" font-weight="400" data-node="start" data-max-width="115">调用 start()</text><rect x="341" y="295" width="132" height="90" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="356" y="323" font-size="17" fill="#292825" font-weight="500" data-node="started" data-max-width="102">立即返回</text><text x="356" y="353" font-size="14" fill="#77746e" font-weight="400" data-node="started" data-max-width="102">Started 通知</text><rect x="495" y="295" width="132" height="90" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="510" y="323" font-size="17" fill="#a64335" font-weight="500" data-node="msg2" data-max-width="102">用户消息 2</text><rect x="649" y="295" width="157" height="90" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="664" y="323" font-size="17" fill="#a64335" font-weight="500" data-node="reply" data-max-width="127">LLM Call</text><text x="664" y="353" font-size="14" fill="#77746e" font-weight="400" data-node="reply" data-max-width="127">即时回复</text><rect x="174" y="456" width="299" height="82" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="189" y="484" font-size="17" fill="#a64335" font-weight="500" data-node="async-tool" data-max-width="269">后台异步执行耗时工具</text><rect x="495" y="456" width="132" height="110" rx="3" fill="#faf8f3" stroke="#e6e2da" stroke-width="0.8"/><text x="510" y="484" font-size="17" fill="#292825" font-weight="500" data-node="inject" data-max-width="102">新消息投递</text><text x="510" y="514" font-size="14" fill="#77746e" font-weight="400" data-node="inject" data-max-width="102">完成结果</text><rect x="649" y="456" width="157" height="110" rx="3" fill="#faf8f3" stroke="#a64335" stroke-width="1.3"/><text x="664" y="484" font-size="17" fill="#a64335" font-weight="500" data-node="deliver" data-max-width="127">LLM Call</text><text x="664" y="514" font-size="14" fill="#77746e" font-weight="400" data-node="deliver" data-max-width="127">交付任务结果</text><text x="371" y="67" font-size="13" fill="#77746e" font-weight="400" paint-order="stroke" stroke="#faf8f3" stroke-width="4" stroke-linejoin="round">前台阻塞等待工具返回</text><text x="413" y="439" font-size="13" fill="#77746e" font-weight="400" paint-order="stroke" stroke="#faf8f3" stroke-width="4" stroke-linejoin="round">启动通知</text><text x="14" y="22" font-size="18" fill="#292825" font-weight="400" >经典 ReAct Loop</text><text x="14" y="274" font-size="18" fill="#292825" font-weight="400" >异步 ReAct Loop</text><text x="14" y="593" font-size="14" fill="#77746e" font-weight="400" >新输入在当前模型步骤结束后处理，后台工具继续运行。</text></g></svg>
