<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" fill="none" aria-hidden="true">
<style>
.drop{stroke:#7f8986;stroke-linecap:round;stroke-width:1.1;animation:rain var(--time) linear infinite;animation-delay:var(--delay);opacity:0}
.ring{stroke:#7f8986;stroke-width:.65;transform-box:fill-box;transform-origin:center;animation:water var(--time) linear infinite;animation-delay:var(--delay);opacity:0}
@keyframes rain{0%{transform:translate(0,0);opacity:0}8%{opacity:var(--opacity)}76%{opacity:var(--opacity)}84%,100%{transform:translate(-24px,var(--fall));opacity:0}}
@keyframes water{0%,75%{opacity:0;transform:scale(.1)}80%{opacity:.26;transform:scale(.25)}100%{opacity:0;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.drop{animation:none;transform:translate(-12px,100px);opacity:.18}.ring{animation:none;transform:scale(.7);opacity:.15}}
</style>
